name: IAC Infrastructure

on:
  push:
    branches:
      - iac

permissions:
  contents: read
  id-token: write

#env:
#  PROJECT_ID: ${{ vars.PROJECT_ID }}
#  PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}

jobs:
  create-vm:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: "projects/666837127066/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
        service_account: "github-actions-sa@gcp-devops-minikube-487813.iam.gserviceaccount.com"
    #    project_id: ${{ env.PROJECT_ID }}

    - uses: google-github-actions/setup-gcloud@v2

    - name: Set Project
      run: gcloud config set project gcp-devops-minikube-487813

    - name: Create VM
      run: |
        gcloud compute instances create minikube-vm \
          --zone=us-central1-a \
          --machine-type=e2-medium \
          --image-family=ubuntu-2204-lts \
          --image-project=ubuntu-os-cloud

    - name: Install Docker & Minikube
      run: |
        gcloud compute ssh minikube-vm --zone=us-central1-a --command="
        sudo apt update -y &&
        sudo apt install -y docker.io &&
        sudo usermod -aG docker \$USER &&
        curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64 &&
        sudo install minikube-linux-amd64 /usr/local/bin/minikube &&
        curl -LO https://storage.googleapis.com/kubernetes-release/release/\`curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt\`/bin/linux/amd64/kubectl &&
        chmod +x kubectl &&
        sudo mv kubectl /usr/local/bin/
        "
